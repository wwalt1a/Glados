name: GLaDOS Check-in

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # 每天北京时间 11:00 (UTC 03:00) 触发一次
    - cron: '0 3 * * *'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 允许随机等待（最大约 50 分钟）+ 脚本执行预算；在 75 分钟内受 Actions 官方完整支持
    timeout-minutes: 75

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 执行 签到脚本
    - name: Setup IPv6 with WARP
      uses: fscarmen/warp-on-actions@v1.2
      with:
        stack: dual

    # 仅在定时触发 (schedule) 时执行 0~50 分钟随机延时，使实际签到时间均匀分布在 11:00 ~ 12:00 之间
    # 采用每 5 分钟心跳日志，防止长时间静默断连；手动触发 (workflow_dispatch) 自动跳过，秒级执行
    - name: Random delay between 11:00 and 12:00
      if: github.event_name == 'schedule'
      run: |
        python - << 'EOF'
        import random, time, sys
        delay = random.randint(0, 3000)
        print(f"Random delay: {delay}s ({delay // 60}m {delay % 60}s) before checkin...", flush=True)
        elapsed = 0
        while elapsed < delay:
            step = min(300, delay - elapsed)
            time.sleep(step)
            elapsed += step
            if elapsed < delay:
                print(f"Still waiting... ({elapsed // 60}m / {delay // 60}m elapsed)", flush=True)
        print("Delay completed, proceeding to checkin...", flush=True)
        EOF

    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        BARK_URL: ${{ secrets.BARK_URL }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        BARK_ICON: ${{ secrets.BARK_ICON }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        RAILGUN_COOKIES: ${{ secrets.RAILGUN_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        GLADOS_NOTIFY_ONLY_ON_FAILURE: ${{ secrets.GLADOS_NOTIFY_ONLY_ON_FAILURE }}

    # 签到失败（配置错误会 exit 1）时也要保活，否则恰好错过最需要提醒的那次
    - name: Keep alive
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: ${{ !cancelled() }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
